<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Hosted PDF</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; }
        object { width: 100%; height: 100vh; }
    </style>
</head>
<body>

    <!-- Embed the PDF. Replace "document.pdf" with your exact file name -->
    <object data="document.pdf" type="application/pdf">
        <p>Your browser does not support embedded PDFs. 
           <a href="document.pdf">Click here to download the PDF instead.</a>
        </p>
    </object>

</body>
</html>
